name: Prüfen

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    name: Typen, Lint, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatierung prüfen
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
