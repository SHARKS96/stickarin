name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages braucht diese Rechte; id-token für das Deployment selbst.
permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deployment, wartet das nächste, statt es abzubrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    name: Bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        # Auf Pages liegt die App unter /stick-karin/.
        run: npm run build
        env:
          STICK_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    name: Veröffentlichen
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
